<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - LASU Attendly</title>
    <!-- Google Fonts & FontAwesome for icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7fc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 36px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .logo-area {
            margin-bottom: 20px;
        }

        .logo-area h1 {
            font-size: 22px;
            color: #0b2e13; /* LASU Green vibe */
            font-weight: 700;
        }

        .logo-area span {
            color: #008751;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1a1a1a;
        }

        .card p {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #444;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px 11px 42px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #008751;
            box-shadow: 0 0 0 3px rgba(0, 135, 81, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #008751;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }

        .btn-primary:hover {
            background-color: #006e41;
        }

        .login-link {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .login-link a {
            color: #008751;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Branding Area -->
            <div class="logo-area">
                <i class="fa-solid fa-graduation-cap" style="font-size: 38px; color: #008751; margin-bottom: 6px;"></i>
                <h1>LASU <span>Attendly</span></h1>
            </div>

            <h2>Create an Account</h2>
            <p>Register to start tracking and managing your attendance seamlessly.</p>

            <!-- Form -->
            <form action="#" method="POST" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="fullname" class="form-control" placeholder="e.g., John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-at"></i>
                        <input type="text" id="username" class="form-control" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">LASU Email</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" class="form-control" placeholder="name@lasu.edu.ng" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-lock fa-solid"></i>
                        <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <!-- Already have an account -->
            <div class="login-link">
                Already have an account? <a href="login.html">Log in</a>
            </div>

            <div class="footer-note">
                &copy; 2026 Lagos State University. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault();
            const fullname = document.getElementById('fullname').value;
            alert(`Account successfully created for ${fullname}! Redirecting to login...`);
            // Add your backend registration fetch logic here
        }
    </script>

</body>
</html>
