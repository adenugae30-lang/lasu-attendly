<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LASU Attendly</title>
    <!-- Google Fonts & FontAwesome for icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7fc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .logo-area {
            margin-bottom: 24px;
        }

        .logo-area h1 {
            font-size: 22px;
            color: #0b2e13; /* LASU Green vibe */
            font-weight: 700;
        }

        .logo-area span {
            color: #008751;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #444;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #008751;
            box-shadow: 0 0 0 3px rgba(0, 135, 81, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #008751;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #006e41;
        }

        .back-to-login {
            margin-top: 20px;
            display: block;
            font-size: 14px;
            color: #008751;
            text-decoration: none;
            font-weight: 500;
        }

        .back-to-login:hover {
            text-decoration: underline;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Branding Area -->
            <div class="logo-area">
                <i class="fa-solid fa-graduation-cap" style="font-size: 40px; color: #008751; margin-bottom: 8px;"></i>
                <h1>LASU <span>Attendly</span></h1>
            </div>

            <h2>Forgot Password?</h2>
            <p>Enter your registered LASU email or username, and we'll send you instructions to reset your password.</p>

            <!-- Form -->
            <form action="#" method="POST" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label for="identifier">Email or Username</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="text" id="identifier" class="form-control" placeholder="e.g., john.doe or name@lasu.edu.ng" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Send Reset Instructions</button>
            </form>

            <!-- Back to Login Link -->
            <a href="login.html" class="back-to-login">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>

            <div class="footer-note">
                &copy; 2026 Lagos State University. All rights reserved.
            </div>
        </div>
    </div>

    <script>
        function handleReset(event) {
            event.preventDefault();
            const identifier = document.getElementById('identifier').value;
            alert(`Password reset link has been sent (if account exists for: ${identifier})`);
        }
    </script>

</body>
</html>
